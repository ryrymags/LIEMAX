# Netlify configuration for the LIEMAX static site.
# The docs/ directory is pre-built (generated by `npm run build:docs-data`
# and committed), so no build command runs on Netlify.
# Security headers per .ai/COMPLIANCE.md.

[build]
  publish = "docs"

[[headers]]
  for = "/*"
  [headers.values]
    # 'unsafe-inline' in script-src is required while app.jsx is transpiled
    # in-browser by Babel standalone; remove it when V2 precompiles JSX.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Versioned static assets (everything is served with ?v= cache keys, so
# long-lived caching is safe; index.html itself stays revalidated).
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
